# ==============================================================================
# ❓ QUESTIONS — in the order they are asked
# ==============================================================================

# These three carry a placeholder and no default: the field looks like it has a
# value, so it must refuse an empty answer — a placeholder alone accepts it
# silently, and the project ends up with no name. The validator is what makes
# Copier ask again.
project_name:
  type: str
  help: "What is the name of your project?"
  placeholder: "My MLOps Project"
  validator: >-
    {% if not project_name %}
    ❌ A project name is required.
    {% endif %}

package_name:
  type: str
  help: "What is the Python package name? (snake_case, no dashes)"
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not package_name %}
    ❌ The package name cannot be empty.
    {% elif not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    ❌ '{{ package_name }}' is not a valid Python package name.
    → Use lowercase letters, digits and underscores only, starting with a letter.
    {% endif %}

# The build backend parses this one as well: hatchling reads `project.version`
# and refuses to build a project whose version it cannot parse. Measured, with
# the default as a control: `abc` and an empty string stop it dead, while `1.0`,
# `1.0.0-rc.1` and even `0.1.0.0` go through.
#
# The rule below is deliberately NARROWER than what hatchling takes, which is
# the opposite of the email validator: it asks for the one shape everybody
# writes, so the message can name a single example instead of a grammar. Someone
# who wanted `1.0` is told to write `1.0.0` rather than left guessing.
version:
  type: str
  help: "What is the initial version of the package?"
  default: "0.1.0"
  validator: >-
    {% if not (version | regex_search('^[0-9]+\\.[0-9]+\\.[0-9]+\\Z')) %}
    ❌ '{{ version }}' is not a version number.
    → Expected MAJOR.MINOR.PATCH, like '0.1.0'. The build backend reads this field and refuses to build a project whose version it cannot parse.
    {% endif %}

# A title is a poor description, and `pyproject.toml` has a field for the
# sentence. The default is the project name, so answering nothing leaves that
# field exactly as it was before this question existed.
package_short_description:
  type: str
  help: "How would you describe the package in one line?"
  default: "{{ project_name }}"

author_name:
  type: str
  help: "Who is the author? (Full Name)"
  placeholder: "John Doe"
  validator: >-
    {% if not author_name %}
    ❌ An author name is required.
    {% endif %}

# The build backend parses this one (hatchling reads `authors[].email` through
# email.headerregistry.Address) and refuses to build a project whose address is
# malformed: a space, or a domain without a dot, and `uv sync` fails inside the
# freshly generated project. So the rule below is the one hatchling applies,
# minus the exotic forms nobody types — a dot-atom local part, and a dotted
# domain ending in a real TLD. Everything it accepts, hatchling accepts too.
#
# The backslashes are doubled because a Jinja string literal is DECODED: a lone
# `\.` is an invalid escape sequence there, which Jinja warns about and will
# eventually stop tolerating. Doubling it is what produces the single `\.` the
# regex needs.
author_email:
  type: str
  help: "What is the author's email address?"
  placeholder: "you@example.com"
  validator: >-
    {% if not author_email %}
    ❌ An email address is required.
    {% elif not (author_email | regex_search('^[A-Za-z0-9._%+\'-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}\\Z')) %}
    ❌ '{{ author_email }}' is not a valid email address.
    → Expected something like 'you@example.com'. The build backend reads this field and refuses to build the project when the address is malformed.
    {% endif %}

# The list is the one NLeSC/python-template offers, so that the set of licenses
# a project can be built under is not a decision this template makes on its
# users' behalf. `Other` is the one difference: it becomes `Proprietary`, which
# is something a project can actually be, and not a placeholder for a license
# someone else will write. It is also the default.
#
# One LICENSE file per open license, and the condition lives in the FILENAME: a
# name that renders to nothing means Copier writes nothing, so exactly one file
# lands — and a proprietary project gets none. Handy consequence: the SPDX
# identifier can be the value, and it reaches `pyproject.toml` with no mapping
# table in between.
license:
  type: str
  help: "Which license do you want to use?"
  choices:
    Proprietary (all rights reserved):
      value: Proprietary
    Apache License, Version 2.0:
      value: Apache-2.0
    MIT license:
      value: MIT
    BSD license (3-clause):
      value: BSD-3-Clause
    ISC license:
      value: ISC
    GNU General Public License v3 or later:
      value: GPL-3.0-or-later
    GNU Lesser General Public License v3 or later:
      value: LGPL-3.0-or-later
  default: Proprietary

# The LICENSE file carries the line, so the question is only asked when there is
# a file to put it in — a proprietary project has none. The validator repeats
# the condition instead of trusting Copier to skip it: a question that is never
# asked must not be able to fail.
copyright_holder:
  type: str
  when: "{{ license != 'Proprietary' }}"
  help: "Who is the copyright holder? (the author by default)"
  default: "{{ author_name }}"
  validator: >-
    {% if license != 'Proprietary' and not copyright_holder %}
    ❌ The copyright holder cannot be empty: the LICENSE file is written with it.
    {% endif %}

modules:
  type: str
  multiselect: true
  help: |
    Which optional building blocks do you want to include?
    (Space toggles, Enter confirms. Drop the ones you do not need)

      gcp     → BigQuery, Cloud Storage, a training VM, Cloud Run deployment
      mlflow  → Experiment tracking and model registry
      prefect → Orchestration of the pipeline

  choices:
    - gcp
    - mlflow
    - prefect
  default:
    - gcp
    - mlflow
    - prefect
