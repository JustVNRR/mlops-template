# ==============================================================================
# ⚙️ SETTINGS — what Copier renders, and what it leaves out
# ==============================================================================

_subdirectory: template

# Files the project owns from the moment it is generated: the template supplies
# a first version and then never touches them again, not even when the template
# changes them — `copier copy --overwrite` and `copier update` both leave them
# alone.
#
# The list stops here on purpose. Those four are artefacts of the user's
# project, where the template's version is only a starting point. The files the
# generated README invites the user to adapt — `params.py`, `data.py`,
# `model.py` and the rest — are CODE, and a fix to code has to be able to reach
# a project that already exists. Updating them is already safe: `copier update`
# applies a three-way patch, so a template change lands without erasing what
# the user wrote around it, and a real conflict is reported instead of being
# applied.
#
# LICENSE is on the list for a reason of its own: a legal document is not a
# file the template should have an opinion about after the fact. It carries the
# year of generation and nothing the template will ever need to correct, and a
# project that added its own clauses — a company name, a jurisdiction — would
# lose them to an update that had no business touching it.
_skip_if_exists:
  - .gitignore
  - README.md
  - notebooks/*.ipynb
  - LICENSE

# Copier already filters `template/` through .gitignore, so the leftovers of a
# local run — a dataset, a virtualenv, a .pkl — are skipped anyway. These
# entries cover what .gitignore does NOT: the runtime directories under
# `models/`, which nothing tracks and therefore nothing ignores, and the
# optional building blocks.
_exclude:
  - models/models/
  - models/params/
  - models/metrics/
  # Optional building blocks, removed by the flags derived from `modules`. The
  # pattern is matched against the path as it will land in the project — so the
  # templates suffix is NOT part of it: `make/gcp.mk` matches
  # `make/gcp.mk.jinja` too, and the Docker block is not on this list at all:
  # nothing removes it.
  - "{% if not with_gcp %}make/gcp.mk{% endif %}"
  - "{% if not with_gcp %}make/bigquery.mk{% endif %}"
  - "{% if not with_gcp %}make/vm.mk{% endif %}"
  - "{% if not with_gcp %}make/cloudrun.mk{% endif %}"
  - "{% if not with_gcp %}make/artifact_registry.mk{% endif %}"
  - "{% if not with_gcp %}scripts/setup_vm.sh{% endif %}"
  - "{% if not with_gcp %}tests/infrastructure/test_gcp_setup.py{% endif %}"
  - "{% if not with_gcp %}tests/api/test_cloud_endpoints.py{% endif %}"
  - "{% if not with_prefect %}src/{{ package_name }}/interface/workflow.py{% endif %}"
