# ==============================================================================
# 🚀 MLOps template — Copier configuration
# ==============================================================================
# Everything that ships to a generated project lives under `template/`. This
# file, the README and the CI at the root describe the TEMPLATE itself and are
# never rendered.
#
# Usage:
#     copier copy gh:JustVNRR/mlops-template my-project

_subdirectory: template

# Copier already filters `template/` through .gitignore, so the leftovers of a
# local run — a dataset, a virtualenv, a .pkl — are skipped anyway. These
# entries cover what .gitignore does NOT: the runtime directories under
# `models/`, which nothing tracks and therefore nothing ignores, and the
# optional building blocks.
_exclude:
  - models/models/
  - models/params/
  - models/metrics/
  # Optional building blocks, removed by the `modules` answer. The pattern is
  # matched against the path as it will land in the project — so the templates
  # suffix is NOT part of it: `Dockerfile` matches `Dockerfile.jinja` too.
  - "{% if 'docker' not in modules %}Dockerfile{% endif %}"
  - "{% if 'docker' not in modules %}.dockerignore{% endif %}"
  - "{% if 'docker' not in modules %}docker-compose.yml{% endif %}"
  - "{% if 'docker' not in modules %}make/docker.mk{% endif %}"
  - "{% if 'docker' not in modules %}tests/api/test_docker_endpoints.py{% endif %}"
  - "{% if 'docker' not in modules %}.github/workflows/docker.yml{% endif %}"
  - "{% if 'gcp' not in modules %}make/gcp.mk{% endif %}"
  - "{% if 'gcp' not in modules %}make/bigquery.mk{% endif %}"
  - "{% if 'gcp' not in modules %}make/vm.mk{% endif %}"
  - "{% if 'gcp' not in modules %}make/cloudrun.mk{% endif %}"
  - "{% if 'gcp' not in modules %}scripts/setup_vm.sh{% endif %}"
  - "{% if 'gcp' not in modules %}tests/infrastructure/test_gcp_setup.py{% endif %}"
  - "{% if 'gcp' not in modules %}tests/api/test_cloud_endpoints.py{% endif %}"
  - "{% if 'prefect' not in modules %}src/{{ package_name }}/interface/workflow.py{% endif %}"

_message_after_copy: |
  Your project {{ project_name }} is ready! 🚀

  Next steps:

    1. cd {{ _copier_conf.dst_path }}
    2. cp .env.sample .env       # then fill in your credentials (GCP, MLflow...)
    3. uv sync                   # creates the .venv/ AND generates the uv.lock
    4. git init && git add -A
    5. git commit -m "Initial commit"

  ⚠️ Important: Make sure your new `uv.lock` is included in this first commit.
  The Dockerfile and CI pipelines rely on it (they install strictly in `--frozen` mode) and will crash if the file is missing from your repository.

  To test your setup:
    - make run_all               # preprocess → train → evaluate → predict
    - make run_api               # the API starts on http://127.0.0.1:8000

  Check README.md for further details

# ==============================================================================
# ❓ QUESTIONS
# ==============================================================================

# These three carry a placeholder and no default: the field looks like it has a
# value, so it must refuse an empty answer — a placeholder alone accepts it
# silently, and the project ends up with no name. The validator is what makes
# Copier ask again.
project_name:
  type: str
  help: "What is the name of your project?"
  placeholder: "My MLOps Project"
  validator: >-
    {% if not project_name %}
    ❌ A project name is required.
    {% endif %}

package_name:
  type: str
  help: "What is the Python package name? (snake_case, no dashes)"
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not package_name %}
    ❌ The package name cannot be empty.
    {% elif not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    ❌ '{{ package_name }}' is not a valid Python package name.
    → Use lowercase letters, digits and underscores only, starting with a letter.
    {% endif %}

author_name:
  type: str
  help: "Who is the author? (Full Name)"
  placeholder: "John Doe"
  validator: >-
    {% if not author_name %}
    ❌ An author name is required.
    {% endif %}

author_email:
  type: str
  help: "What is the author's email address?"
  placeholder: "you@example.com"
  validator: >-
    {% if not author_email %}
    ❌ An email address is required.
    {% endif %}

license:
  type: str
  help: "Which license do you want to use?"
  choices:
    - Proprietary
    - MIT
    - Apache-2.0
    - BSD-3-Clause
  default: Proprietary

modules:
  type: str
  multiselect: true
  help: |
    Which optional building blocks do you want to include? 
    (Space toggles, Enter confirms. Drop the ones you do not need)

      gcp     → BigQuery, Cloud Storage, a training VM, Cloud Run deployment
      mlflow  → Experiment tracking and model registry
      prefect → Orchestration of the pipeline
      docker  → Packaging the API as a container image
  choices:
    - gcp
    - mlflow
    - prefect
    - docker
  default:
    - gcp
    - mlflow
    - prefect
    - docker
