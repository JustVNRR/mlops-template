# ==============================================================================
# 🚀 MLOps template — Copier configuration
# ==============================================================================
# Everything that ships to a generated project lives under `template/`. This
# file, the README and the CI at the root describe the TEMPLATE itself and are
# never rendered.
#
# Usage:
#     copier copy gh:JustVNRR/mlops-template my-project

_subdirectory: template

# Copier already filters `template/` through .gitignore, so the leftovers of a
# local run — a dataset, a virtualenv, a .pkl — are skipped anyway. These
# entries cover what .gitignore does NOT: the runtime directories under
# `models/`, which nothing tracks and therefore nothing ignores, and the
# optional building blocks.
_exclude:
  - models/models/
  - models/params/
  - models/metrics/
  # Optional building blocks, removed by the `modules` answer. The pattern is
  # matched against the path as it will land in the project — so the templates
  # suffix is NOT part of it: `Dockerfile` matches `Dockerfile.jinja` too.
  - "{% if 'docker' not in modules %}Dockerfile{% endif %}"
  - "{% if 'docker' not in modules %}.dockerignore{% endif %}"
  - "{% if 'docker' not in modules %}docker-compose.yml{% endif %}"
  - "{% if 'docker' not in modules %}make/docker.mk{% endif %}"
  - "{% if 'docker' not in modules %}tests/api/test_docker_endpoints.py{% endif %}"
  - "{% if 'docker' not in modules %}.github/workflows/docker.yml{% endif %}"
  - "{% if 'gcp' not in modules %}make/gcp.mk{% endif %}"
  - "{% if 'gcp' not in modules %}make/bigquery.mk{% endif %}"
  - "{% if 'gcp' not in modules %}make/vm.mk{% endif %}"
  - "{% if 'gcp' not in modules %}make/cloudrun.mk{% endif %}"
  - "{% if 'gcp' not in modules %}scripts/setup_vm.sh{% endif %}"
  - "{% if 'gcp' not in modules %}tests/infrastructure/test_gcp_setup.py{% endif %}"
  - "{% if 'gcp' not in modules %}tests/api/test_cloud_endpoints.py{% endif %}"

_message_after_copy: |
  ✅ Your project is ready.

  Next steps, from the project root:

    1. cp .env.sample .env     # then fill in what you need (GCP, MLflow…)
    2. uv sync                 # creates .venv/ AND uv.lock
    3. make run_all            # preprocess → train → evaluate → predict
    4. make run_api            # the API starts on http://127.0.0.1:8000

  Commit uv.lock. The Dockerfile and the CI install with `uv sync --frozen`,
  which fails without it.

  The folder is not a git repository yet:
    git init && git add -A && git commit -m "Initial commit"

  README.md covers the rest.

# ==============================================================================
# ❓ QUESTIONS
# ==============================================================================
# Only questions a newcomer can answer on sight. Anything that requires
# understanding the template (optional building blocks, ways of working) is
# decided by editing the generated project, not by answering up front.

project_name:
  type: str
  help: The project name, as it should appear in the README and pyproject.toml.
  default: My MLOps Project

package_name:
  type: str
  help: The Python import name (snake_case, no dashes).
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not package_name %}
    ❌ The package name cannot be empty.
    {% elif not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    ❌ '{{ package_name }}' is not a valid Python package name.
    → Use lowercase letters, digits and underscores only, starting with a letter.
    {% endif %}

author_name:
  type: str
  help: The author name that goes into pyproject.toml.
  default: Your Name

author_email:
  type: str
  help: The author email that goes into pyproject.toml.
  default: you@example.com

license:
  type: str
  help: The license declared in pyproject.toml.
  choices:
    - Proprietary
    - MIT
    - Apache-2.0
    - BSD-3-Clause
  default: Proprietary

modules:
  type: str
  multiselect: true
  help: |
    The optional building blocks to include — space toggles, enter confirms.
    Leave them all on to get the full project; drop the ones you do not need.

      gcp      BigQuery, Cloud Storage, a training VM, Cloud Run deployment
      mlflow   experiment tracking and model registry
      prefect  orchestration of the pipeline
      docker   packaging the API as a container image (used by the GCP path
               to build the image Cloud Run deploys)
  choices:
    - gcp
    - mlflow
    - prefect
    - docker
  default:
    - gcp
    - mlflow
    - prefect
    - docker
