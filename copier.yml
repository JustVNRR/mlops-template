# ==============================================================================
# 🚀 MLOps template — Copier configuration
# ==============================================================================
# Everything that ships to a generated project lives under `template/`. This
# file, the README and the CI at the root describe the TEMPLATE itself and are
# never rendered.
#
# Usage:
#     copier copy gh:JustVNRR/mlops-template <project-folder>
#
# This file is only an index. Copier reads every YAML document of it and merges
# them, so each `!include` below is an ordinary file under copier/, holding one
# concern. Nothing stops a key from appearing in several of them: the four
# list-valued settings (`_exclude`, `_skip_if_exists`, ...) are concatenated,
# and for anything else the last document wins.

# The subdirectory Copier renders, and the files it leaves out.
!include copier/settings.yml
---
# What the user reads before and after a copy, and before and after an update.
!include copier/messages.yml
---
# The six questions, in the order they are asked.
!include copier/questions.yml
---
# One boolean per building block, derived from `modules`.
!include copier/flags.yml
