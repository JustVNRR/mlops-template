name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository is a Copier TEMPLATE, not a project: there is no pyproject.toml
# at the root and `src/{{ package_name }}/` is not valid Python. Every job below
# therefore generates a real project first, then validates THAT. Running lint or
# pytest here directly would validate nothing.
env:
  PROJECT_NAME: CI Project
  PACKAGE_NAME: ci_project
  AUTHOR_NAME: CI
  AUTHOR_EMAIL: ci@example.com
  LICENSE: MIT

jobs:
  lint:
    name: Lint (generated project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate a project from the template
        run: |
          uvx copier copy --defaults \
            -d "project_name=$PROJECT_NAME" \
            -d "package_name=$PACKAGE_NAME" \
            -d "author_name=$AUTHOR_NAME" \
            -d "author_email=$AUTHOR_EMAIL" \
            -d "license=$LICENSE" \
            . "$RUNNER_TEMP/generated"

      # The answers file is produced by a template file named
      # `{{ _copier_conf.answers_file }}.jinja`: if it is missing, that file was
      # renamed or its suffix dropped.
      - name: Check the generation produced a complete project
        working-directory: ${{ runner.temp }}/generated
        run: |
          test -f .copier-answers.yml || { echo "❌ .copier-answers.yml is missing"; exit 1; }
          test -f src/ci_project/params.py || { echo "❌ the package was not renamed"; exit 1; }
          if grep -rn "package_folder" . ; then
            echo "❌ a template placeholder survived: name the file *.jinja"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/generated
        run: uv sync

      - name: Lint
        working-directory: ${{ runner.temp }}/generated
        run: uv run ruff check .

      - name: Check formatting
        working-directory: ${{ runner.temp }}/generated
        run: uv run ruff format --check .

  tests:
    name: Tests (generated project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate a project from the template
        run: |
          uvx copier copy --defaults \
            -d "project_name=$PROJECT_NAME" \
            -d "package_name=$PACKAGE_NAME" \
            -d "author_name=$AUTHOR_NAME" \
            -d "author_email=$AUTHOR_EMAIL" \
            -d "license=$LICENSE" \
            . "$RUNNER_TEMP/generated"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/generated
        run: uv sync

      - name: Create .env from the template
        working-directory: ${{ runner.temp }}/generated
        run: cp .env.sample .env

      - name: Run tests
        working-directory: ${{ runner.temp }}/generated
        run: uv run pytest

      - name: Run the pipeline end to end
        working-directory: ${{ runner.temp }}/generated
        run: make run_all

  docker:
    name: Docker build & smoke test (generated project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate a project from the template
        run: |
          uvx copier copy --defaults \
            -d "project_name=$PROJECT_NAME" \
            -d "package_name=$PACKAGE_NAME" \
            -d "author_name=$AUTHOR_NAME" \
            -d "author_email=$AUTHOR_EMAIL" \
            -d "license=$LICENSE" \
            . "$RUNNER_TEMP/generated"

      # The Dockerfile installs with `uv sync --frozen`, which needs a lock: it
      # is not shipped, it is generated. This is exactly what a new user does.
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/generated
        run: uv sync

      - name: Build the production image
        working-directory: ${{ runner.temp }}/generated
        run: |
          docker build \
            --build-arg DOCKER_BASE_IMAGE=python:3.12-slim \
            --tag api:ci \
            .

      - name: Start the container and check the API answers
        run: |
          docker run -d --name api-ci -e PORT=8000 -p 8000:8000 api:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ > /dev/null 2>&1; then
              echo "✅ The API answered after ${attempt} attempt(s)."
              curl -fsS http://localhost:8000/
              exit 0
            fi
            sleep 2
          done

          echo "❌ The API never answered. Container logs:"
          docker logs api-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs api-ci 2>/dev/null || true

  reduced:
    name: Reduced projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Whatever the `modules` question removes, the remaining project must
      # still install, lint, test and run. This job is what keeps the guards
      # honest as building blocks are added.
      - name: Generate a project without any optional module
        run: |
          uvx copier copy --defaults \
            -d "project_name=Minimal Project" \
            -d "package_name=minimal_project" \
            -d "author_name=$AUTHOR_NAME" \
            -d "author_email=$AUTHOR_EMAIL" \
            -d "license=$LICENSE" \
            -d "modules=[]" \
            . "$RUNNER_TEMP/minimal"

      - name: Check the optional files are gone
        working-directory: ${{ runner.temp }}/minimal
        run: |
          for f in Dockerfile .dockerignore docker-compose.yml make/docker.mk \
                   tests/api/test_docker_endpoints.py .github/workflows/docker.yml \
                   make/gcp.mk make/bigquery.mk make/vm.mk make/cloudrun.mk \
                   scripts/setup_vm.sh \
                   tests/infrastructure/test_gcp_setup.py \
                   tests/api/test_cloud_endpoints.py \
                   src/minimal_project/interface/workflow.py ; do
            if [ -e "$f" ]; then echo "❌ $f should have been excluded"; exit 1; fi
          done

          # A surviving import only shows up at runtime, on someone else's
          # machine: check for it here.
          if grep -rn "google\.cloud\|import mlflow\|prefect" src/ tests/ ; then
            echo "❌ a source file still imports an optional package"
            exit 1
          fi

          # `.dockerignore` is itself excluded when docker is unchecked, so the
          # loop skips what is not there.
          for f in README.md .env.sample .gitignore .dockerignore .github ; do
            [ -e "$f" ] || continue
            if grep -rn -i "docker\|gcp\|bigquery\|gcloud\|mlflow\|prefect" "$f" ; then
              echo "❌ $f still mentions an optional building block"
              exit 1
            fi
          done
          echo "✅ no optional building block survived"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/minimal
        run: uv sync

      - name: Create .env from the template
        working-directory: ${{ runner.temp }}/minimal
        run: cp .env.sample .env

      - name: Lint, test and run the pipeline
        working-directory: ${{ runner.temp }}/minimal
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          make run_all

      # The two blocks overlap once: the Artifact Registry targets live in
      # make/docker.mk because they build an image, but they also need GCP.
      # Docker without GCP is the combination that catches a wrong condition.
      - name: Generate a project with Docker but no GCP
        run: |
          uvx copier copy --defaults \
            -d "project_name=Docker Only" \
            -d "package_name=docker_only" \
            -d "author_name=$AUTHOR_NAME" \
            -d "author_email=$AUTHOR_EMAIL" \
            -d "license=$LICENSE" \
            -d 'modules=["docker"]' \
            . "$RUNNER_TEMP/dockeronly"

      - name: Check the docker/gcp overlap is handled
        working-directory: ${{ runner.temp }}/dockeronly
        run: |
          targets=$(make help | sed 's/\x1b\[[0-9;]*m//g')
          echo "$targets" | grep -q docker_build_local || { echo "❌ the local build target is missing"; exit 1; }
          echo "$targets" | grep -q test_api_docker   || { echo "❌ the container test target is missing"; exit 1; }
          if echo "$targets" | grep -qE "artifact_registry|cloudrun|docker_push_prod" ; then
            echo "❌ a GCP-only target survived in a project without GCP"
            exit 1
          fi
          if [ -e make/gcp.mk ] || [ -e scripts/setup_vm.sh ] ; then
            echo "❌ a GCP file survived"
            exit 1
          fi
          echo "✅ the docker/gcp overlap is handled"

  # The answers are free text, and they land in files that have a syntax of
  # their own: a `"` in a project name used to produce an unreadable
  # pyproject.toml, silently. Generating from hostile answers and re-reading
  # what came out is the only check that sees it — `uv sync` on the other jobs
  # uses a friendly name and would never notice.
  escaping:
    name: Escaping (hostile answers)
    runs-on: ubuntu-latest
    env:
      # A double quote, a backslash and a triple quote, which break the TOML
      # string, the TOML escape, and the docstring respectively.
      HOSTILE_PROJECT_NAME: 'Mr. "Quoted" \ """ Project'
      HOSTILE_AUTHOR_NAME: 'O''Keefe "The Great" & <Sons>'
      # A quoted local part, which is a legal address: hatchling parses this
      # field (email.headerregistry.Address) and refuses to build a project
      # whose email is malformed. This job exercises the escaping, not
      # hatchling's validation.
      HOSTILE_AUTHOR_EMAIL: '"o''keefe"@example.com'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate a project from hostile answers
        run: |
          uvx copier copy --defaults \
            -d "project_name=$HOSTILE_PROJECT_NAME" \
            -d "package_name=hostile_project" \
            -d "author_name=$HOSTILE_AUTHOR_NAME" \
            -d "author_email=$HOSTILE_AUTHOR_EMAIL" \
            -d "license=MIT" \
            . "$RUNNER_TEMP/hostile"

      # An answer that parses is not enough: `O'Keefe` parses, and is not
      # what was typed. Every value is read back and compared to the answer.
      - name: Check every answer survived verbatim
        working-directory: ${{ runner.temp }}/hostile
        run: |
          python3 - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          name = os.environ["HOSTILE_PROJECT_NAME"]
          author = os.environ["HOSTILE_AUTHOR_NAME"]
          email = os.environ["HOSTILE_AUTHOR_EMAIL"]

          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          authors = project.get("authors") or [{}]

          docstring = ast.get_docstring(
              ast.parse(pathlib.Path("src/hostile_project/__init__.py").read_text())
          )

          found = {
              "pyproject.toml description": project.get("description"),
              "pyproject.toml author name": authors[0].get("name"),
              "pyproject.toml author email": authors[0].get("email"),
              "__init__.py docstring": docstring,
          }
          expected = {
              "pyproject.toml description": name,
              "pyproject.toml author name": author,
              "pyproject.toml author email": email,
              "__init__.py docstring": f"{name}.\n\nThe import name is declared in pyproject.toml.",
          }

          wrong = {label: (found[label], want) for label, want in expected.items() if found[label] != want}
          for label, (got, want) in wrong.items():
              print(f"❌ {label}:\n   written  {got!r}\n   answered {want!r}")
          if wrong:
              raise SystemExit(1)
          print("✅ every answer was written verbatim")
          PY
